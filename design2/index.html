<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2 · Clean Progressive Dashboard</title><link rel="stylesheet" href="../shared/common.css">
<style>:root{--acc:#2f81f7;--r:14px}.app{display:flex;min-height:100vh}
aside{width:232px;background:var(--bg2);border-right:1px solid var(--line);padding:14px;position:sticky;top:0;height:100vh;overflow:auto;transition:width .2s}
aside.mini{width:64px}aside.mini span.l{display:none}
aside button.nv{display:flex;gap:10px;width:100%;background:none;border:0;color:var(--mut);padding:9px 10px;border-radius:10px;font:inherit;cursor:pointer;text-align:left}
aside button.nv.on{background:var(--bg3);color:var(--fg);font-weight:600}
.wrap{flex:1;min-width:0}.top{display:flex;gap:10px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:10}
main{padding:18px;max-width:1150px}.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:14px}.kpi b{font-size:1.6em;display:block}
.tabbar{display:none}
@media(max-width:760px){aside{display:none}.tabbar{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:1px solid var(--line);z-index:30;justify-content:space-around;padding:6px 0 14px}
.tabbar button{background:none;border:0;color:var(--mut);font:12px var(--font);display:flex;flex-direction:column;align-items:center}.tabbar button.on{color:var(--acc)}.tabbar b{font-size:20px}main{padding-bottom:90px}}.grp{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:14px 10px 4px;opacity:.7}aside.mini .grp{display:none}.ctx{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.pill.chem{background:#2f81f733;color:var(--acc);cursor:pointer}aside button.nv:hover{background:var(--bg3)}@media(max-width:760px){.top input{display:none}.top{padding:10px 12px}}</style></head><body>
<div class="app"><aside id="side"><div class="row" style="margin-bottom:14px"><b style="font-size:1.1em"><span class="l">◆ Tutor</span></b><span class="sp"></span><button class="btn ghost sm" onclick="$('#side').classList.toggle('mini')">⇤</button></div><div id="nav"></div></aside>
<div class="wrap"><div class="top"><h2 class="sp" id="ttl" style="margin:0">Today</h2><input type="text" placeholder="Search ⌘K" style="max-width:200px" onfocus="toast('Search: concepts, files, standards')"><button class="btn ghost" onclick="toggleTheme()">🌓</button><button class="btn ghost" onclick="popMenu(this,[{t:'👤 Dustin B. · Grade 9'},{t:'👪 Switch to guardian view',fn:function(){modal('Guardian view','<p>Weekly summary: 3h 40m, 41 items, mastery +9%. Ahead in chemistry; gap in alcohol classification queued.</p>')}},{t:'⚙️ Settings',fn:function(){go('settings')}}])">DB ▾</button></div><main id="main"></main></div></div>
<nav class="tabbar" id="tb"></nav>
<script src="../shared/data.js"></script><script src="../shared/nav.js"></script><script>
var GROUPS=[['Learn',['home','learn','practice','map','skills']],['⚗️ Chemistry plugins',['lab','mech','ptable','titr','spec','draw']],['School & growth',['school','readiness','timeline','archive','portfolio']],['Credentials',['credmap','credentials']],['System',['plugins','settings']]];
$('#nav').innerHTML=GROUPS.map(function(g){return '<div class="grp l">'+g[0]+'</div>'+g[1].map(function(n){var t=title(n);return '<button class="nv" data-n="'+n+'">'+t[2]+' <span class="l">'+t[1]+'</span></button>'}).join('')}).join('');
var CTX={home:'Your plan for today, tuned to mastery pace',learn:'Alcohols · Lesson 6.2 — scaffolds fade as you show mastery',map:'Living map of everything you know, with forgetting curves',skills:'Optional attributes and unlocks — no leaderboards',practice:'Adaptive items held in your zone of proximal development',lab:'Chem plugin · MOL/SDF/PDB viewer',mech:'Chem plugin · step through arrow-pushing',ptable:'Chem plugin · interactive elements',titr:'Chem plugin · virtual burette and pH curve',spec:'Chem plugin · JCAMP-DX IR / ¹H NMR',draw:'Chem plugin · SMILES structure pad',school:'Teacher materials ingested; standards as an overlay',archive:'Your personal research archive',timeline:'Growth vs typical pacing, age 5 → PhD',portfolio:'Milestones and mastery evidence',credmap:'Path from badges to degrees',credentials:'W3C Verifiable Credentials · selective disclosure',readiness:'Evidence for subject or grade acceleration',plugins:'Subjects and tools as plugins',settings:'Stage, theme, consent and data export'};
$('#tb').innerHTML=['home','map','practice','school'].map(function(n){var t=title(n);return '<button data-n="'+n+'"><b>'+t[2]+'</b>'+t[1].split(' ')[0]+'</button>'}).join('')+'<button data-more><b>☰</b>More</button>';
$$('[data-n]').forEach(function(b){b.onclick=function(){go(b.dataset.n)}});
$('[data-more]').onclick=function(){drawer('All sections',NAV.map(function(t){return '<button class="btn opt" onclick="closeDrawer();go(\''+t[0]+'\')">'+t[2]+' '+t[1]+'</button>'}).join(''))};
window.render=function(n){var t=title(n);$$('[data-n]').forEach(function(b){b.classList.toggle('on',b.dataset.n===n)});$('#ttl').textContent=t[1];
 var k=n==='home'?'<div class="kpis"><div class="kpi"><span class="mut sm">Chem mastery</span><b>71%</b><span class="pill g">+9% this week</span></div><div class="kpi"><span class="mut sm">Ahead of class</span><b>2.1 wks</b></div><div class="kpi"><span class="mut sm">Review due</span><b>3</b></div><div class="kpi"><span class="mut sm">Streak</span><b>12 days</b></div></div>':'';
 var chem=['lab','mech','ptable','titr','spec','draw'].indexOf(n)>=0;var cx='<div class="ctx"><span class="mut">'+(CTX[n]||'')+'</span>'+(chem?'<span class="pill chem" onclick="go(\'plugins\')">🧩 ChemKit Pro active</span>':'')+'</div>';$('#main').innerHTML=cx+k+SCREENS[n]();window.scrollTo(0,0);wire($('#main'))};
</script></body></html>
