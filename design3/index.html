<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3 · Graph-Centric Explorer</title><link rel="stylesheet" href="../shared/common.css">
<style>:root{--acc:#39d0d8;--bg:#070b10}body{overflow:hidden}
#canvas{position:fixed;inset:0;padding-top:54px}#canvas svg{width:100%;height:100%}
.bar3{position:fixed;top:0;left:0;right:0;height:54px;display:flex;align-items:center;gap:8px;padding:0 12px;background:#070b10e6;border-bottom:1px solid var(--line);z-index:20}body.light .bar3{background:#fffe}
.tools{position:fixed;left:12px;top:70px;display:flex;flex-direction:column;gap:6px;z-index:20}.tools button{width:44px;height:44px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);color:var(--fg);font-size:18px;cursor:pointer}.tools button.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
#dock{position:fixed;top:62px;right:10px;bottom:10px;width:min(560px,calc(100% - 80px));background:var(--bg2);border:1px solid var(--line);border-radius:16px;z-index:25;display:flex;flex-direction:column;transition:transform .25s;box-shadow:-10px 0 40px #0009}
#dock.closed{transform:translateX(110%)}#dock .hd{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}#dock .bd{overflow:auto;padding:14px;flex:1}
#pal{position:fixed;top:80px;left:50%;transform:translateX(-50%);width:min(520px,94vw);z-index:120;background:var(--bg2);border:1px solid var(--acc);border-radius:14px;padding:10px;display:none;box-shadow:0 20px 60px #000}#pal.on{display:block}#pal input{width:100%}
#pal .it{padding:8px;border-radius:8px;cursor:pointer}#pal .it:hover,#pal .it.sel{background:var(--bg3)}
.legend{position:fixed;left:70px;bottom:12px;z-index:20;font-size:12px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
@media(max-width:700px){#dock{left:8px;right:8px;width:auto;top:auto;height:62vh}#dock.closed{transform:translateY(110%)}.legend{display:none}.tools{top:auto;bottom:12px;flex-direction:row;left:8px}#dock:not(.closed)~.tools{display:none}}.tools{max-height:calc(100vh - 130px);overflow:auto}@media(max-width:700px){#where{display:none}.bar3 .btn{padding:6px 9px;white-space:nowrap}.bar3 b{white-space:nowrap}.tools{right:8px;max-height:none;overflow-x:auto}.tools button{flex:0 0 44px}}@media(max-width:700px){.hm{display:none}.bar3{gap:4px;padding:0 6px}.bar3 b{font-size:14px}}</style></head><body>
<div class="bar3"><b>⬡ Concept Graph</b><span class="mut sm" id="where">/ Chemistry / Alcohols</span><span class="sp"></span><button class="btn" onclick="pal()">⌘K<span class="hm"> Command</span></button><button class="btn ghost" onclick="popMenu(this,[{t:'Layout: force'},{t:'Layout: layered by prerequisite',fn:function(){toast('Layered layout')}},{t:'View: adjacency matrix',fn:matrix},{t:'Export graph (GraphML)',fn:function(){toast('graph.graphml exported')}}])">View ▾</button><button class="btn ghost" onclick="toggleTheme()">🌓</button></div>
<div id="canvas"><svg data-graph="graph" preserveAspectRatio="xMidYMid meet"></svg></div>
<div id="dock" class="closed"><div class="hd"><b id="dt" class="sp">Panel</b><button class="btn ghost" id="pin" onclick="this.classList.toggle('on');toast(this.classList.contains('on')?'Panel pinned':'Unpinned')">📌</button><button class="btn ghost" onclick="go('map')">✕</button></div><div class="bd" id="main"></div></div>
<div class="tools" id="tools"></div>
<div class="legend"><span style="color:#3fb950">●</span> mastered <span style="color:#58a6ff">●</span> solid <span style="color:#d29922">●</span> learning <span style="color:#6e7681">●</span> locked · node size = mastery</div>
<div id="pal"><input type="text" placeholder="Jump to concept, screen or action…" oninput="palFilter(this.value)"><div id="pl"></div></div>
<script src="../shared/data.js"></script><script src="../shared/nav.js"></script><script>var START="map";
$('#tools').innerHTML=NAV.filter(function(t){return t[0]!=='map'}).map(function(t){return '<button title="'+t[1]+'" data-n="'+t[0]+'">'+t[2]+'</button>'}).join('');
$$('#tools button').forEach(function(b){b.onclick=function(){go(b.dataset.n)}});wire(document);
window.render=function(n){var t=title(n);$$('#tools button').forEach(function(b){b.classList.toggle('on',b.dataset.n===n)});$('#where').textContent='/ Chemistry / '+t[1];
 if(n==='map'){$('#dock').classList.add('closed');return}$('#dt').textContent=t[2]+' '+t[1];$('#main').innerHTML=SCREENS[n]();$('#dock').classList.remove('closed');wire($('#main'))};
var ITEMS=NAV.map(function(t){return{l:t[2]+' '+t[1],f:function(){go(t[0])}}}).concat(CONCEPTS.map(function(c){return{l:'◉ '+c.n,f:function(){conceptDrawer(c.id)}}}));
function pal(){$('#pal').classList.add('on');var i=$('#pal input');i.value='';palFilter('');i.focus()}
function palFilter(v){$('#pl').innerHTML='';ITEMS.filter(function(x){return x.l.toLowerCase().indexOf(v.toLowerCase())>=0}).slice(0,8).forEach(function(x){var d=h('<div class="it"></div>');d.textContent=x.l;d.onclick=function(){$('#pal').classList.remove('on');x.f()};$('#pl').appendChild(d)})}
document.addEventListener('keydown',function(e){if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();pal()}if(e.key==='Escape'){$('#pal').classList.remove('on');closeDrawer()}});
document.addEventListener('click',function(e){if(!$('#pal').contains(e.target)&&!e.target.closest('.bar3'))$('#pal').classList.remove('on')});
function matrix(){var ids=CONCEPTS.slice(0,10);modal('Adjacency matrix (prerequisites)','<div style="overflow:auto"><table class="sm"><tr><th></th>'+ids.map(function(c){return '<th>'+c.id+'</th>'}).join('')+'</tr>'+ids.map(function(r){return '<tr><th>'+r.id+'</th>'+ids.map(function(c){return '<td style="background:'+((c.pre||[]).indexOf(r.id)>=0?mcol(c.m)+'88':'')+'"></td>'}).join('')+'</tr>'}).join('')+'</table></div>')}
</script></body></html>
